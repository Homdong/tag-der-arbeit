<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tag der Arbeit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="1. Mai">
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    /* Hell wie der Rahmen des Originalspiels */
    --bg: #f7f7f7;
    --panel: #e6e6e6;
    --btn: #2e2e2e;
    --btn-down: #8dc63f;
    --line: #1c1c1c;
    --text: #222;
    --muted: #8a8a8a;
    --accent: #8dc63f;
    --fire: #c8352b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }

  /* Layout: Portrait = Spiel oben, Steuerung unten. Landscape = Steuerung links/rechts. */
  #app {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: grid;
    grid-template-areas: "game game" "pause pause" "hud hud" "pad fire";
    grid-template-rows: auto auto auto 1fr;
    grid-template-columns: 1.25fr 1fr;
  }
  @media (orientation: landscape) {
    #app {
      grid-template-areas: "pad game fire";
      grid-template-rows: 1fr;
      grid-template-columns: 1fr auto 1fr;
    }
  }

  #game {
    grid-area: game;
    position: relative;
    background: #f7f7f7;
    aspect-ratio: 3 / 2;
    width: 100%;
    max-height: 100%;
    margin: 0 auto;
  }
  @media (orientation: landscape) {
    #game { height: 100%; width: auto; }
  }
  #game ruffle-player { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Hochformat während der Runde: nur die Karte zeigen (Bühne 140,77 – 460,317).
     Pause-Knopf und Steine/Zeit/Punkte liegen darunter. */
  #pause, #hud { display: none; }
  @media (orientation: portrait) {
    #app.ingame #game { aspect-ratio: 320 / 240; overflow: hidden; }
    #app.ingame #game ruffle-player {
      right: auto; bottom: auto;
      width: calc(100% * 600 / 320);
      height: calc(100% * 400 / 240);
      left: calc(-100% * 140 / 320);
      top: calc(-100% * 77 / 240);
    }
    #app.ingame #pause { display: block; }
    #app.ingame #hud { display: grid; }
    #stick { --s: min(44vw, 190px); }
    #fire { --s: min(30vw, 130px); }
  }
  #pause {
    grid-area: pause;
    appearance: none; margin: 8px 8px 0; height: 36px;
    background: #9ed017; color: #2a3a05; border: 2px solid #5d7a0d; border-radius: 4px;
    font-family: inherit; font-size: 16px; font-weight: 600; letter-spacing: .03em;
    touch-action: manipulation;
  }
  #pause:active { filter: brightness(.9); }
  #pause.on { background: #f2c94c; border-color: #a07d12; color: #3a2c00; }
  #hud {
    grid-area: hud;
    grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 8px 0;
  }
  #hud .panel {
    background: var(--panel); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    padding: 10px; min-height: 0;
  }
  #hud canvas { width: auto; height: 118px; max-width: 100%; image-rendering: pixelated; }
  #hud canvas.stones { height: 86px; }

  .zone { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 12px; }
  #padzone { grid-area: pad; position: relative; touch-action: none; }
  #firezone { grid-area: fire; flex-direction: column; gap: 14px; }

  /* Joystick: erscheint dort, wo der Daumen das linke Feld berührt. */
  #stick {
    --s: min(40vmin, 170px);
    position: absolute; left: 50%; top: 50%;
    width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius: 50%; pointer-events: none;
    background: rgba(46, 46, 46, .10); border: 2px solid rgba(46, 46, 46, .30);
  }
  #stick.active { background: rgba(141, 198, 63, .18); border-color: var(--btn-down); }
  #stick .knob {
    position: absolute; left: 50%; top: 50%;
    width: 44%; height: 44%; margin: -22% 0 0 -22%; border-radius: 50%;
    background: var(--btn); box-shadow: 0 3px 0 rgba(0, 0, 0, .35);
    transform: translate(var(--x, 0px), var(--y, 0px));
  }
  #stick.active .knob { background: #3a3a3a; }

  #fire {
    --s: min(26vmin, 112px);
    width: var(--s); height: var(--s); border-radius: 50%;
    background: var(--fire); border: 3px solid #7d1d17; color: #fff;
    font-weight: 700; font-size: calc(var(--s) * 0.15); letter-spacing: .02em;
    display: flex; align-items: center; justify-content: center; text-align: center;
    touch-action: none; box-shadow: 0 4px 0 #7d1d17;
  }
  #fire.on { transform: translateY(3px); box-shadow: 0 1px 0 #7d1d17; filter: brightness(1.15); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; max-width: 160px; }

  /* Startbildschirm */
  #start {
    position: fixed; inset: 0; z-index: 10;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left));
    text-align: center;
  }
  #start[hidden] { display: none; }
  #start h1 { margin: 0; font-size: 34px; line-height: 1.05; letter-spacing: .01em; }
  #start h1 span { color: var(--accent); display: block; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 6px; }
  #play {
    appearance: none; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--fire); color: #fff; font-family: inherit; font-weight: 700; font-size: 22px; line-height: 1; padding: 16px 40px;
    box-shadow: 0 4px 0 #7d1d17;
  }
  #play:active, #go:active { transform: translateY(3px); box-shadow: 0 1px 0 #7d1d17; }
  #start .step2, #start.named .step1 { display: none; }
  #start.named .step2 { display: flex; }
  #namebox { flex-direction: column; align-items: center; gap: 14px; width: min(100%, 320px); }
  #namebox label { font-weight: 600; font-size: 18px; }
  #name {
    width: 100%; font: inherit; font-size: 20px; text-align: center;
    padding: 12px 14px; border: 2px solid #cfcfcf; border-radius: 10px; background: #fff; color: var(--text);
    -webkit-user-select: text; user-select: text;
  }
  #name:focus { outline: none; border-color: var(--accent); }
  #go {
    appearance: none; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--fire); color: #fff; font-family: inherit; font-weight: 700; font-size: 22px; line-height: 1; padding: 16px 40px;
    box-shadow: 0 4px 0 #7d1d17;
  }
  #install { display: none; color: var(--muted); font-size: 14px; max-width: 340px; }
  #install.show { display: block; }
  #install b { color: var(--text); }
  .small { color: var(--muted); font-size: 12px; max-width: 360px; }
</style>
</head>
<body>

<div id="start">
  <h1><span>Berlin Chaos</span>Tag der Arbeit</h1>
  <button id="play" class="step1" type="button">Play</button>
  <form id="namebox" class="step2">
    <label for="name">Wie heißt dein Punk?</label>
    <input id="name" maxlength="16" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
    <button id="go" type="submit">Play</button>
  </form>
  <p id="install" class="step1">Für Vollbild und Offline-Spielen: in Safari auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.</p>
  <p class="small">Joystick links zum Laufen, roter Knopf gedrückt halten zum Werfen und Anzünden.</p>
</div>

<div id="app">
  <div class="zone" id="padzone">
    <div id="stick" aria-label="Joystick"><div class="knob"></div></div>
  </div>
  <div id="game"></div>
  <button id="pause" type="button">Pause</button>
  <div id="hud">
    <div class="panel"><canvas class="stones" data-src="34,132,78,58"></canvas></div>
    <div class="panel"><canvas data-src="492,120,70,92"></canvas></div>
  </div>
  <div class="zone" id="firezone">
    <div id="fire" aria-label="Werfen">WERFEN</div>
    <div class="hint">gedrückt halten</div>
  </div>
</div>

<script src="ruffle/ruffle.js"></script>
<script>
(() => {
  const KEYS = {
    up:    { key: "ArrowUp",    code: "ArrowUp",    keyCode: 38 },
    down:  { key: "ArrowDown",  code: "ArrowDown",  keyCode: 40 },
    left:  { key: "ArrowLeft",  code: "ArrowLeft",  keyCode: 37 },
    right: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
    fire:  { key: " ",          code: "Space",      keyCode: 32 },
  };

  let player = null;
  const held = new Set();

  function sendKey(type, name) {
    if (!player) return;
    // Ruffle nimmt Tasten nur an, wenn der Player den Fokus hat (ohne Antippen der Spielfläche fehlt er).
    if (type === "keydown" && document.activeElement !== player) player.focus({ preventScroll: true });
    const k = KEYS[name];
    const ev = new KeyboardEvent(type, { key: k.key, code: k.code, bubbles: true, cancelable: true });
    // Ältere Flash-Logik liest keyCode; der Konstruktor setzt ihn nicht.
    Object.defineProperty(ev, "keyCode", { get: () => k.keyCode });
    Object.defineProperty(ev, "which", { get: () => k.keyCode });
    player.dispatchEvent(ev);
  }
  function press(name)   { if (!held.has(name)) { held.add(name); sendKey("keydown", name); } }
  function release(name) { if (held.has(name))  { held.delete(name); sendKey("keyup", name); } }

  // Joystick: Daumen irgendwo ins linke Feld, dort erscheint der Stick. 8 Richtungen.
  const padzone = document.getElementById("padzone");
  const stick = document.getElementById("stick");
  const SECTORS = { 0: ["right"], 1: ["right", "down"], 2: ["down"], 3: ["down", "left"],
                    4: ["left"], "-4": ["left"], "-3": ["left", "up"], "-2": ["up"], "-1": ["up", "right"] };
  let stickPointer = null, cx = 0, cy = 0;

  function setDirs(dirs) {
    for (const d of ["up", "down", "left", "right"]) {
      if (dirs.has(d)) press(d); else release(d);
    }
  }
  function moveStick(x, y) {
    const R = stick.offsetWidth / 2;
    const dx = x - cx, dy = y - cy, dist = Math.hypot(dx, dy);
    const s = dist > R * 0.6 ? R * 0.6 / dist : 1;   // Knopf bleibt im Ring
    stick.style.setProperty("--x", dx * s + "px");
    stick.style.setProperty("--y", dy * s + "px");
    const dirs = new Set();
    if (dist > R * 0.22) {
      for (const d of SECTORS[Math.round(Math.atan2(dy, dx) / (Math.PI / 4))]) dirs.add(d);
    }
    setDirs(dirs);
  }
  function resetStick() {
    stickPointer = null;
    stick.classList.remove("active");
    stick.style.left = stick.style.top = "";
    stick.style.setProperty("--x", "0px");
    stick.style.setProperty("--y", "0px");
    setDirs(new Set());
  }
  padzone.addEventListener("pointerdown", e => {
    if (stickPointer !== null) return;
    e.preventDefault();
    stickPointer = e.pointerId;
    try { padzone.setPointerCapture(e.pointerId); } catch {}
    const r = padzone.getBoundingClientRect(), R = stick.offsetWidth / 2;
    cx = Math.min(Math.max(e.clientX, r.left + R), r.right - R);
    cy = Math.min(Math.max(e.clientY, r.top + R), r.bottom - R);
    stick.style.left = cx - r.left + "px";
    stick.style.top = cy - r.top + "px";
    stick.classList.add("active");
    moveStick(e.clientX, e.clientY);
  });
  padzone.addEventListener("pointermove", e => {
    if (e.pointerId === stickPointer) moveStick(e.clientX, e.clientY);
  });
  for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) {
    padzone.addEventListener(t, e => { if (e.pointerId === stickPointer) resetStick(); });
  }

  const fire = document.getElementById("fire");
  fire.addEventListener("pointerdown", e => {
    e.preventDefault();
    try { fire.setPointerCapture(e.pointerId); } catch {}
    fire.classList.add("on");
    press("fire");
  });
  for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) {
    fire.addEventListener(t, () => { fire.classList.remove("on"); release("fire"); });
  }

  // Eigener Pause-Knopf: Ruffle nimmt keine künstlichen Klicks an, daher wird der ganze Emulator angehalten.
  const pauseBtn = document.getElementById("pause");
  function setPaused(on) {
    if (!player) return;
    const api = player.ruffle();
    if (on) api.suspend(); else api.resume();
    pauseBtn.textContent = on ? "Weiter" : "Pause";
    pauseBtn.classList.toggle("on", on);
  }
  pauseBtn.addEventListener("click", () => setPaused(!pauseBtn.classList.contains("on")));

  // Wenn die App in den Hintergrund geht: keine Taste "hängen" lassen und die Runde anhalten.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      resetStick(); fire.classList.remove("on"); release("fire");
      if (app.classList.contains("ingame")) setPaused(true);
    }
  });
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());

  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS && !standalone) document.getElementById("install").classList.add("show");

  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { publicPath: "ruffle/", polyfills: false };

  // Ablauf: Play -> Name -> Play -> direkt in die Runde.
  // main-direct.swf ist main.swf mit einem Zusatzskript: Es überspringt Zeitung und Namensseite
  // (FlashVars autostart/namePl) und meldet "menu", wenn nach der Runde PLAY in der Zeitung gedrückt wird.
  const start = document.getElementById("start");
  const nameInput = document.getElementById("name");
  let savedName = "";
  try { savedName = localStorage.getItem("punkName") || ""; } catch {}
  nameInput.value = savedName || "KleenaPunk";

  function showNameScreen() {
    start.hidden = false;
    start.classList.add("named");
  }
  document.getElementById("play").addEventListener("click", () => {
    showNameScreen();
    nameInput.focus();
    nameInput.select();
  });
  document.getElementById("namebox").addEventListener("submit", e => {
    e.preventDefault();
    const name = nameInput.value.trim() || "KleenaPunk";
    try { localStorage.setItem("punkName", name); } catch {}
    nameInput.blur();
    start.hidden = true;
    launch(name);
  });

  let ticking = false;
  function launch(name) {
    if (player) player.remove();
    app.classList.remove("ingame");
    resetStick();
    player = window.RufflePlayer.newest().createPlayer();
    document.getElementById("game").appendChild(player);
    player.ruffle().load({
      url: "swf/main-direct.swf",
      parameters: { autostart: "1", namePl: name },
      autoplay: "on",
      unmuteOverlay: "hidden",
      splashScreen: false,
      preferredRenderer: "canvas",
      base: new URL("htm/", location.href).href,
      contextMenu: "off",
      letterbox: "on",
      scale: "showAll",
      forceScale: true,
      backgroundColor: "#F7F7F7",
      openUrlMode: "deny",
      allowScriptAccess: true,   // für fscommand("menu") aus main-direct.swf
      allowNetworking: "all",
    });
    const onCommand = cmd => { if (cmd === "menu") showNameScreen(); };
    const api = player.ruffle();
    if (api.addFSCommandHandler) api.addFSCommandHandler(onCommand);
    else player.onFSCommand = onCommand;
    window.player = player;
    if (!ticking) { ticking = true; requestAnimationFrame(tick); }
  }

  // Erkennt die Spielrunde am Rahmen um die Karte und spiegelt die Anzeigen.
  const app = document.getElementById("app");
  const hud = [...document.querySelectorAll("#hud canvas")].map(c => {
    const [x, y, w, h] = c.dataset.src.split(",").map(Number);
    return { c, ctx: c.getContext("2d"), x, y, w, h };
  });
  // Nur Stellen mitten in einfarbigen Flächen, damit Rundung bei jeder Zoomstufe passt.
  const FRAME_PIXELS = [
    [100, 200, [0xe6, 0xe6, 0xe6]], [480, 200, [0xe6, 0xe6, 0xe6]],  // Seitenteile
    [300, 52, [0xe6, 0xe6, 0xe6]], [300, 322, [0xe6, 0xe6, 0xe6]],   // über und unter der Karte
    [300, 332, [0x9e, 0xd0, 0x17]],                                  // grüner Pause-Knopf
    [5, 200, [0xf7, 0xf7, 0xf7]],                                    // Hintergrund
  ];
  let frameCount = 0;

  function stageCanvas() {
    return player && player.shadowRoot && player.shadowRoot.querySelector("canvas");
  }
  function inRound(cv, k) {
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    if (!ctx) return false;
    return FRAME_PIXELS.every(([x, y, rgb]) => {
      const d = ctx.getImageData(Math.round(x * k), Math.round(y * k), 1, 1).data;
      return rgb.every((v, i) => Math.abs(d[i] - v) < 12);
    });
  }
  function tick() {
    requestAnimationFrame(tick);
    const cv = stageCanvas();
    if (!cv || !cv.width) return;
    const k = cv.width / 600;
    if (frameCount++ % 15 === 0) {
      app.classList.toggle("ingame", inRound(cv, k));
      // Auch Ruffles eigener Play-Knopf über der Karte setzt fort.
      const paused = !player.ruffle().isPlaying;
      if (paused !== pauseBtn.classList.contains("on")) {
        pauseBtn.textContent = paused ? "Weiter" : "Pause";
        pauseBtn.classList.toggle("on", paused);
      }
    }
    if (!app.classList.contains("ingame") || hud[0].c.offsetParent === null) return;
    for (const h of hud) {
      const w = Math.round(h.w * k), hh = Math.round(h.h * k);
      if (h.c.width !== w || h.c.height !== hh) { h.c.width = w; h.c.height = hh; }
      h.ctx.drawImage(cv, h.x * k, h.y * k, h.w * k, h.h * k, 0, 0, w, hh);
    }
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
